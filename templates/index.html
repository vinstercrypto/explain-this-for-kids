<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explain This for Kids</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Explain This for Kids</h1>
            <p class="subtitle">Paste text or a URL to get a simple explanation</p>
        </header>

        <div class="input-section">
            <form id="explainForm">
                <div class="form-group">
                    <label for="input_text">Enter text or paste a URL:</label>
                    <textarea
                        id="input_text"
                        name="input_text"
                        rows="8"
                        placeholder="Paste an article URL or the text you want explained..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="grade_level">Select grade level:</label>
                    <select id="grade_level" name="grade_level" required>
                        <option value="Kindergarten">Kindergarten</option>
                        <option value="1st grade">1st grade</option>
                        <option value="2nd grade">2nd grade</option>
                        <option value="3rd grade">3rd grade</option>
                        <option value="4th grade">4th grade</option>
                        <option value="5th grade" selected>5th grade</option>
                        <option value="6th grade">6th grade</option>
                        <option value="7th grade">7th grade</option>
                        <option value="8th grade">8th grade</option>
                        <option value="9th grade">9th grade</option>
                        <option value="10th grade">10th grade</option>
                        <option value="11th grade">11th grade</option>
                        <option value="12th grade">12th grade</option>
                        <option value="Adult TLDR">Adult TLDR</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Explain it!</button>
            </form>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Working on your explanation...</p>
        </div>

        <div id="error" class="error-message" style="display: none;"></div>

        <div id="result" class="result" style="display: none;">
            <h2 id="result-title"></h2>

            <div class="explanation">
                <p id="result-explanation"></p>
            </div>

            <div class="why-matters">
                <h3>Why this matters:</h3>
                <ul id="result-why-matters"></ul>
            </div>

            <div class="vocabulary-section">
                <h3>Vocabulary Builder:</h3>
                <div id="result-vocabulary" class="vocabulary-list"></div>
            </div>

            <div class="action-buttons">
                <button id="copy-link-btn" class="btn-secondary" title="Copy shareable link">
                    📋 Copy Link
                </button>
                <button id="download-pdf-btn" class="btn-secondary" title="Download as PDF">
                    📄 Download PDF
                </button>
            </div>

            <div class="email-section">
                <h3>Email me a copy:</h3>
                <form id="emailForm" class="email-form">
                    <input
                        type="email"
                        id="email-input"
                        name="email"
                        placeholder="your.email@example.com"
                        required
                    >
                    <button type="submit" class="btn-secondary">📧 Send Email</button>
                </form>
                <div id="email-message" class="message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
